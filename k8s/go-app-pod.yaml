apiVersion: v1
kind: Pod
metadata:
  name: go-app-pod
  labels:
    app: go-app
spec:
  containers:
    - name: go-app-container
      image: ghcr.io/gurianovm/containers-lab-1/app:sha-ba81a68
      ports:
        - containerPort: 8080
      env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "secret"
        - name: DB_NAME
          value: "myapp"